name: Build NexBell Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXBELL_API_TOKEN: ${{ secrets.NEXBELL_API_TOKEN }}
      ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets and sync Capacitor
        working-directory: artifacts/nexbell-android
        run: |
          pnpm run build:android:web
          pnpm exec cap sync android

      - name: Create signing key
        working-directory: artifacts/nexbell-android/android
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > nexbell-release.jks
            printf 'storeFile=nexbell-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "${KEY_ALIAS:-nexbell}" "${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" > keystore.properties
          else
            bash make-keystore.sh
          fi

      - name: Build release APK
        working-directory: artifacts/nexbell-android/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: nexbell-release-apk
          path: artifacts/nexbell-android/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
